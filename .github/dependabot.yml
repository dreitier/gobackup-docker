# Dependency updates. "daily" runs Monday to Friday.
# gobackup itself is updated by .github/workflows/update-gobackup.yml (its releases aren't valid Go module versions).
# Commit prefixes decide whether semantic-release publishes a new version when the PR is merged:
#   build(deps): ...  -> patch release (base images that end up in the published image)
#   ci(deps): ...     -> no release (pipeline and release tooling)
version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope

  # dependencies gobackup is built with (gobackup/go.mod); they end up in the published image
  - package-ecosystem: gomod
    directory: /gobackup
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    # gobackup itself is a tool dependency, all other modules are indirect ones
    allow:
      - dependency-type: all
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      # pinned to a release commit by .github/workflows/update-gobackup.yml
      - dependency-name: github.com/gobackup/gobackup
      # azblob 1.x changed the API gobackup uses (GetSASURL); stays at 0.6.x until upstream migrates
      - dependency-name: github.com/Azure/azure-sdk-for-go/sdk/storage/azblob
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # hook versions in .pre-commit-config.yaml; the CI lint job uses the same actionlint version
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      pre-commit:
        patterns:
          - "*"
