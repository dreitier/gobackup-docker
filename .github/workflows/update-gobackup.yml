name: Update gobackup

# gobackup is built from source with the dependency versions of gobackup/go.mod. Dependabot keeps the dependencies
# current, but can't track gobackup itself: upstream's module path has no /v3 suffix, so its releases can only be
# required by commit (pseudo-version). This workflow checks the latest gobackup release daily and opens (or updates)
# a PR that pins the release commit in gobackup/go.mod and sets GOBACKUP_VERSION in the Dockerfile.
# The PR title decides the image release: gobackup patch -> build(deps) (patch), minor -> feat, major -> feat! (breaking).
on:
  schedule:
    - cron: '7 5 * * 1-5'
  workflow_dispatch:
    inputs:
      version:
        description: gobackup release tag, e.g. v3.1.1 (default latest)
        required: false

permissions:
  contents: read

concurrency:
  group: update-gobackup
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update gobackup
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
          # the runner's Go downloads the toolchain required by the go directive in gobackup/go.mod
          GOTOOLCHAIN: auto
        run: |
          if [[ -n "$REQUESTED" ]]; then
            version="$REQUESTED"
          else
            # releases/latest skips pre-releases and drafts
            version=$(gh api repos/gobackup/gobackup/releases/latest --jq .tag_name)
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid gobackup version '${version}'"
            exit 1
          fi
          current=$(sed -n 's/^ARG GOBACKUP_VERSION=//p' Dockerfile)

          if [[ "$current" == "$version" ]]; then
            echo "::notice::gobackup is already at ${version}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(printf '%s\n%s\n' "${current#v}" "${version#v}" | sort -V | tail -n 1)" != "${version#v}" ]]; then
            echo "::notice::${version} is older than the current ${current}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # commit of the release tag (works for lightweight and annotated tags)
          commit=$(gh api "repos/gobackup/gobackup/commits/${version}" --jq .sha)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the commit of ${version}"
            exit 1
          fi

          # downloads are verified against the Go checksum database
          (
            cd gobackup
            go get "github.com/gobackup/gobackup@${commit}"
            go mod tidy
          )
          sed -i -E "s/^ARG GOBACKUP_VERSION=.*/ARG GOBACKUP_VERSION=${version}/" Dockerfile
          git diff --exit-code --quiet Dockerfile && { echo "::error::Dockerfile unchanged"; exit 1; }

          # replace directives of dependencies are ignored, so gobackup/go.mod copies upstream's; flag changes
          upstream_replace=$(gh api "repos/gobackup/gobackup/contents/go.mod?ref=${commit}" --jq .content \
            | base64 -d | grep -E '^replace |=>' | sed -E 's/^replace //; s/^[[:space:]]+//' | sort || true)
          local_replace=$(sed -n 's/^replace //p' gobackup/go.mod | sort)
          replace_note=""
          if [[ "$upstream_replace" != "$local_replace" ]]; then
            echo "::warning::gobackup ${version} has different replace directives than gobackup/go.mod"
            replace_note="**Check the replace directives:** gobackup ${version} has"$'\n\n```\n'"${upstream_replace:-(none)}"$'\n```\n\n'"but gobackup/go.mod has"$'\n\n```\n'"${local_replace:-(none)}"$'\n```'
          fi

          IFS=. read -r cur_major cur_minor _ <<< "${current#v}"
          IFS=. read -r new_major new_minor _ <<< "${version#v}"
          notes="https://github.com/gobackup/gobackup/releases/tag/${version}"
          footer=""
          if (( new_major > cur_major )); then
            title="feat(gobackup)!: update gobackup to ${version}"
            footer="BREAKING CHANGE: gobackup ${version} is a new major version. Check its release notes before upgrading: ${notes}"
          elif (( new_minor > cur_minor )); then
            title="feat(gobackup): update gobackup to ${version}"
          else
            title="build(deps): update gobackup to ${version}"
          fi

          {
            echo "changed=true"
            echo "title=${title}"
            echo "body<<EOF_BODY"
            echo "Updates gobackup from ${current} to ${version} (commit ${commit})."
            echo
            echo "Release notes: ${notes}"
            if [[ -n "$replace_note" ]]; then
              echo
              echo "$replace_note"
            fi
            if [[ -n "$footer" ]]; then
              echo
              echo "$footer"
            fi
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: steps.update.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # PRs created with the app token (unlike GITHUB_TOKEN) trigger the CI workflow.
      # A fixed branch means a newer gobackup release updates the open PR instead of opening a second one.
      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          branch: update/gobackup
          delete-branch: true
          add-paths: |
            Dockerfile
            gobackup/go.mod
            gobackup/go.sum
          commit-message: |
            ${{ steps.update.outputs.title }}

            ${{ steps.update.outputs.body }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
