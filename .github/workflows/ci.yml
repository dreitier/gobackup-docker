name: CI

# Runs on pull requests, weekly (to catch new CVEs in the Fedora packages), manually,
# and as the first stage of the release workflow.
on:
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read linter versions from .pre-commit-config.yaml
        id: versions
        run: |
          rev_of() {
            awk -v repo="repo: $1" 'index($0, repo) { found = 1; next } found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml
          }
          actionlint=$(rev_of https://github.com/rhysd/actionlint)
          if [ -z "$actionlint" ]; then
            echo "::error file=.pre-commit-config.yaml::could not read the actionlint version"
            exit 1
          fi
          echo "actionlint=${actionlint#v}" >> "$GITHUB_OUTPUT"

      - name: actionlint
        env:
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      # gobackup/go.mod pins gobackup by commit; it must be the commit of the release in ARG GOBACKUP_VERSION
      - name: gobackup commit matches GOBACKUP_VERSION
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ARG GOBACKUP_VERSION=//p' Dockerfile)
          pinned=$(awk '$1 == "github.com/gobackup/gobackup" { print $2 }' gobackup/go.mod)
          expected=$(gh api "repos/gobackup/gobackup/commits/${version}" --jq .sha)
          if [[ -z "$pinned" || "${pinned##*-}" != "${expected:0:12}" ]]; then
            echo "::error file=gobackup/go.mod::gobackup/go.mod pins '${pinned}', but ${version} is commit ${expected:0:12}; run the update-gobackup workflow"
            exit 1
          fi
          echo "gobackup ${version} = ${pinned}"

      - name: Lint Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    services:
      # database for the end-to-end backup test
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gobackup
          POSTGRES_PASSWORD: ci-secret
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gobackup"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the arm64 image runs dnf, so it needs emulation
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # same platforms as the release; multi-platform images can't be loaded into the local docker daemon
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # amd64 image from cache, loaded for the tests and the Trivy scan
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gobackup:ci
          cache-from: type=gha

      - name: Check image
        run: |
          # the image must not run as root
          test "$(docker inspect --format '{{.Config.User}}' gobackup:ci)" = "1000:1000"
          # built from source: the version is set via ldflags from ARG GOBACKUP_VERSION
          version=$(sed -n 's/^ARG GOBACKUP_VERSION=//p' Dockerfile)
          docker run --rm gobackup:ci --version | tee /dev/stderr | grep -qx "gobackup version ${version#v}"
          # every tool gobackup shells out to for the supported databases, compressors and the openssl encryptor
          docker run --rm --entrypoint /bin/sh gobackup:ci -c '
            set -e
            for tool in pg_dump pg_dumpall mysqldump mariadb-backup mongodump redis-cli sqlite3 \
                        tar gzip pigz bzip2 xz lzip lzop zstd compress split openssl; do
              path=$(command -v "$tool") || { echo "missing: $tool" >&2; exit 1; }
              echo "$tool: $path"
            done
            # tools used by restore scripts that run in this image
            for tool in psql curl sed; do
              path=$(command -v "$tool") || { echo "missing: $tool" >&2; exit 1; }
              echo "$tool: $path"
            done
            pg_dump --version
            mongodump --version | head -n 1'

      # dumps PostgreSQL and archives a folder, then compresses, encrypts and stores the backup locally;
      # the password comes from an environment variable (${VAR} expansion in the config)
      - name: End-to-end backup
        env:
          E2E: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$E2E/data" "$E2E/backups"
          echo "hello from the archive" > "$E2E/data/hello.txt"
          docker run --rm --network host -e PGPASSWORD=ci-secret --entrypoint psql gobackup:ci \
            -h localhost -U gobackup -d shop -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE orders (id serial PRIMARY KEY, item text); INSERT INTO orders (item) VALUES ('backup');"
          # the container runs as UID 1000
          chmod 0777 "$E2E/backups"
          docker run --rm --network host \
            -e PG_PASSWORD=ci-secret \
            -e ENCRYPTION_PASSWORD=ci-encryption \
            -v "$GITHUB_WORKSPACE/.github/ci/e2e.yml:/etc/gobackup/gobackup.yml:ro" \
            -v "$E2E/data:/data:ro" \
            -v "$E2E/backups:/backups" \
            gobackup:ci perform

          backup=$(find "$E2E/backups" -type f -name '*.tar.gz.enc' | head -n 1)
          test -n "$backup" || { ls -laR "$E2E/backups"; exit 1; }
          echo "backup: $backup"
          mkdir "$E2E/restore"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -pass pass:ci-encryption -in "$backup" \
            | tar -xz -C "$E2E/restore"
          find "$E2E/restore" -type f
          grep -rq "hello from the archive" "$E2E/restore"
          grep -rqa "CREATE TABLE public.orders" "$E2E/restore"

      # `run` must keep running in the foreground (`start` would daemonize and the container would exit)
      - name: Scheduler stays in the foreground
        run: |
          docker run -d --name gobackup-run --network host \
            -e PG_PASSWORD=ci-secret \
            -e ENCRYPTION_PASSWORD=ci-encryption \
            -v "$GITHUB_WORKSPACE/.github/ci/e2e.yml:/etc/gobackup/gobackup.yml:ro" \
            gobackup:ci
          if ! curl -fsS --retry 15 --retry-delay 1 --retry-all-errors http://localhost:2703/status | grep -q 'GoBackup is running'; then
            docker logs gobackup-run
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Running}}' gobackup-run)" = "true"
          docker logs gobackup-run
          docker rm -f gobackup-run

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gobackup:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # reporting only (Security tab); gobackup's Go dependencies are kept current by Dependabot,
          # remaining findings are mostly in Fedora packages (e.g. the MongoDB tools)
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
