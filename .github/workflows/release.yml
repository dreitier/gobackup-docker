name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release (dreitier/shared-ci-components/semantic-release, its default config) derives the next
#    version from the Conventional Commits since the last tag, updates CHANGELOG.md, pushes the release
#    commit + tag and creates the GitHub release.
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
# 3. the multi-arch image is pushed to Docker Hub and GHCR, signed with cosign and attested.
#    Its CycloneDX SBOM goes to Dependency-Track (secret DEPENDENCYTRACK_API_KEY). Trivy, SBOM, upload and
#    signing come from dreitier/shared-ci-components.
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token, which may bypass the branch protection of main
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # checkout, release tooling, bot identity and the default config come with the action
      # (tag x.y.z, CHANGELOG.md, GitHub release without PR comments)
      - name: Run semantic-release
        id: release
        uses: dreitier/shared-ci-components/semantic-release@c8ebf58b2404cb3f7307c155525c68abfe1fc580 # v1.1.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # exactly the existing header of CHANGELOG.md – another title would be added on top of it
          changelog-title: "# Changelog\n\nAll notable changes to this project are documented in this file. It is generated by [semantic-release](https://github.com/semantic-release/semantic-release) from [Conventional Commits](https://www.conventionalcommits.org/); entries up to 0.20220713.0 were written by hand. Since 1.0.0 the image has its own [Semantic Versioning](https://semver.org/spec/v2.0.0.html), independent of the gobackup version it contains."

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read gobackup version
        id: gobackup
        run: |
          version=$(sed -n 's/^ARG GOBACKUP_VERSION=//p' Dockerfile)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # 1.2.3 -> 1.2.3, 1.2, 1, latest; plus gobackup-v3.1.1 for the contained gobackup version
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            dreitier/gobackup
            ghcr.io/dreitier/gobackup
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=gobackup-${{ steps.gobackup.outputs.version }}
            type=raw,value=latest
          labels: |
            com.dreitier.gobackup.version=${{ steps.gobackup.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # keyless Sigstore signatures (GitHub OIDC identity of this workflow), verifiable with `cosign verify`;
      # the provenance comes from actions/attest-build-provenance below
      - name: Sign images
        uses: dreitier/shared-ci-components/cosign-sign@eec1480693feee5edb0272c24f63a398bee80108 # v1.0.0
        with:
          images: |
            index.docker.io/dreitier/gobackup
            ghcr.io/dreitier/gobackup
          digest: ${{ steps.build.outputs.digest }}

      - name: Attest image on Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/dreitier/gobackup
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image on GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dreitier/gobackup
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # CycloneDX SBOM of the released image → Dependency-Track (project gobackup, version = release). A separate
  # job: a Dependency-Track outage must not fail the image job. The image is public – no login.
  sbom:
    name: SBOM → Dependency-Track
    needs: [semantic-release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate SBOM
        id: sbom
        uses: dreitier/shared-ci-components/sbom@eec1480693feee5edb0272c24f63a398bee80108 # v1.0.0
        with:
          image: ghcr.io/dreitier/gobackup@${{ needs.image.outputs.digest }}

      - name: Upload to Dependency-Track
        uses: dreitier/shared-ci-components/dependency-track-upload@eec1480693feee5edb0272c24f63a398bee80108 # v1.0.0
        with:
          api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          bom: ${{ steps.sbom.outputs.file }}
          project-name: gobackup
          project-version: ${{ needs.semantic-release.outputs.version }}
